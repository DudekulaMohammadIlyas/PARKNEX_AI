name: ParkNex AI Automated Testing & Deployment Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  selenium-tests:
    name: Selenium Web Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas requests selenium webdriver-manager

      - name: Start Express Backend API Server
        run: |
          cd backend
          node index.js &
          sleep 5
        env:
          PORT: 5000

      - name: Execute Selenium Web Automation Suite (351+ Unique Tests)
        run: |
          python tests/selenium/test_selenium.py
        env:
          BASE_URL: http://localhost:5000

      - name: Upload Selenium Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report
          path: |
            test-cases/selenium_test_cases.xlsx
            Testing_Reports/selenium/
            Testing_Reports/selenium_test_cases.xlsx

  appium-tests:
    name: Appium Mobile Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Appium Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas requests Appium-Python-Client

      - name: Start Express Backend API Server
        run: |
          cd backend
          node index.js &
          sleep 5
        env:
          PORT: 5000

      - name: Execute Appium Mobile Automation Suite (351+ Unique Tests)
        run: |
          python tests/appium/test_appium.py
        env:
          BASE_URL: http://localhost:5000

      - name: Upload Appium Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appium-report
          path: |
            test-cases/appium_test_cases.xlsx
            Testing_Reports/appium/
            Testing_Reports/appium_test_cases.xlsx

  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Load Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas requests locust

      - name: Start Express Backend API Server
        run: |
          cd backend
          node index.js &
          sleep 5
        env:
          PORT: 5000

      - name: Execute Locust Load / Performance Suite (350 Unique Scenarios)
        run: |
          python tests/load/run_load_tests.py
        env:
          BASE_URL: http://localhost:5000

      - name: Upload Load Testing Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: load-report
          path: |
            test-cases/load_test_cases.xlsx
            Testing_Reports/load-testing/
            Testing_Reports/load_test_cases.xlsx

  dast-security-tests:
    name: DAST Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install DAST Security Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas requests beautifulsoup4

      - name: Start Express Backend API Server
        run: |
          cd backend
          node index.js &
          sleep 5
        env:
          PORT: 5000

      - name: Execute DAST Security Automation Suite (350 Unique Rules)
        run: |
          python tests/dast/run_dast_tests.py
        env:
          BASE_URL: http://localhost:5000

      - name: Upload DAST Security Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: |
            test-cases/dast_test_cases.xlsx
            Testing_Reports/dast-security/
            Testing_Reports/dast_test_cases.xlsx

  bundle-reports:
    name: Bundle Reports
    runs-on: ubuntu-latest
    needs:
      - selenium-tests
      - appium-tests
      - load-tests
      - dast-security-tests
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Report Generation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas

      - name: Download All Testing Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts/

      - name: Bundle All Reports & Excel Workbooks
        run: |
          python scripts/bundle_reports.py

      - name: Upload Combined Quality Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: combined-testing-reports
          path: |
            reports/
            Testing_Reports/
            test-cases/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - bundle-reports
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web-app/package-lock.json'

      - name: Install Web App Dependencies
        run: |
          cd web-app
          npm ci || npm install

      - name: Build Web Application Bundle (Vite)
        run: |
          cd web-app
          npm run build
          cp dist/index.html dist/404.html

      - name: Pre-Deployment Build Validation
        run: |
          echo "🔍 Validating built website artifact in web-app/dist..."
          find web-app/dist -maxdepth 3 -type f
          
          if [ ! -f "web-app/dist/index.html" ]; then
            echo "❌ ERROR: index.html missing from web-app/dist!"
            exit 1
          fi
          
          if [ ! -s "web-app/dist/index.html" ]; then
            echo "❌ ERROR: index.html is empty!"
            exit 1
          fi

          if [ ! -d "web-app/dist/assets" ]; then
            echo "❌ ERROR: assets/ directory missing from web-app/dist!"
            exit 1
          fi

          echo "✅ Pre-deployment build validation passed! index.html and assets/ present."

      - name: Setup GitHub Pages Configuration
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact (Web App Only)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web-app/dist'

      - name: Deploy Web Application to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-Deployment Verification
        run: |
          echo "🌐 Validating live deployment at https://dudekulammohammadilyas.github.io/PARKNEX_AI/..."
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://dudekulammohammadilyas.github.io/PARKNEX_AI/ || echo "000")
          echo "Live HTTP Status Code: $STATUS"

